

# NeuroSynapse - FRRouting (FRR) integration
#
# Runs a real FRR router in a container that NeuroSynapse's backend
# connects to over SSH (via Netmiko), exactly as it would a physical
# Cisco/Juniper/MikroTik device. This replaces the in-memory simulator
# with an actual routing daemon for end-to-end testing on real hardware
# semantics, while the simulator remains available as a fallback.
#
# TWO NETWORKS, ON PURPOSE:
#   - neurosynapse-net  -> eth0, carries SSH management traffic
#                          (host 2222 -> container 22). NEVER target
#                          this interface with link_failure -- taking
#                          it down severs the connection NeuroSynapse
#                          needs to heal it back, so the MAPE-K loop
#                          can't recover on its own.
#   - frr-lab-net       -> eth1, a second NIC purely for failure/
#                          healing demos. Point --interface at this one.
#
# After `docker compose up -d`, confirm the interface names with:
#   docker exec neuro-frr ip -br link
#
# Usage:
#   docker compose up -d
#   python manage.py setup_frr_device
#   ssh admin@localhost -p 2222   (password: admin)

services:
  frr-router:
    image: frrouting/frr:latest
    container_name: neuro-frr
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - "2222:22"
    volumes:
      - ./frr/daemons:/etc/frr/daemons
      - ./frr/vtysh.conf:/etc/frr/vtysh.conf
      - ./frr/init.sh:/init.sh
    environment:
      - FRR_USER=admin
      - FRR_PASSWORD=admin
      # init.sh binds the management IP to eth0 by default -- leave
      # this as-is. Failure injection should target eth1 instead.
      - MGMT_IFACE=eth0
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: unless-stopped
    networks:
      neurosynapse-net: {}   # -> becomes eth0 (management/SSH, do not touch)
      frr-lab-net: {}        # -> becomes eth1 (safe to fail/heal)

networks:
  neurosynapse-net:
    driver: bridge
  frr-lab-net:
    driver: bridge